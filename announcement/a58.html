<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mnemonics Explorer · People 2019-03.30</title>
<style>
    :root{
        --bg:#070a11;
        --text:#e8ecf5;
        --muted:#8b97ad;
        --stroke:rgba(255,255,255,.09);
        --accent:#7c5cff;
        --accent2:#22d3ee;
        --radius:18px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
        margin:0;
        height:100dvh;
        display:flex;
        flex-direction:column;
        overflow:hidden;
        color:var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
        -webkit-font-smoothing:antialiased;
        background:
            radial-gradient(1200px 620px at 8% -12%, #1a1440 0%, transparent 62%),
            radial-gradient(900px 520px at 112% 112%, #072a33 0%, transparent 60%),
            var(--bg);
    }

    /* ---------- scrollbars ---------- */
    ::-webkit-scrollbar{ width:10px; height:10px; }
    ::-webkit-scrollbar-track{ background:transparent; }
    ::-webkit-scrollbar-thumb{
        background:rgba(255,255,255,.12);
        border-radius:99px;
        border:3px solid transparent;
        background-clip:content-box;
    }
    ::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,.24); background-clip:content-box; }

    /* ---------- top bar ---------- */
    .topbar{
        position:relative;
        z-index:20;
        flex:0 0 auto;
        display:flex;
        align-items:center;
        gap:16px;
        padding:12px 16px;
        background:rgba(8,11,18,.72);
        backdrop-filter:blur(20px) saturate(160%);
        -webkit-backdrop-filter:blur(20px) saturate(160%);
        border-bottom:1px solid var(--stroke);
    }

    .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
    .logo{
        width:38px; height:38px; border-radius:12px;
        display:grid; place-items:center;
        background:linear-gradient(135deg,#7c5cff,#22d3ee);
        color:#060912; font-weight:800; font-size:17px;
        box-shadow:0 8px 24px -8px rgba(124,92,255,.9);
        flex:0 0 auto;
    }
    .brand h1{ margin:0; font-size:14.5px; font-weight:650; letter-spacing:.01em; white-space:nowrap; }
    .brand p{ margin:2px 0 0; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }

    /* ---------- search ---------- */
    .search{ position:relative; flex:1 1 300px; max-width:720px; margin:0 auto; }

    .search input{
        width:100%; height:46px;
        padding:0 46px 0 44px;
        border-radius:14px;
        background:rgba(255,255,255,.05);
        border:1px solid var(--stroke);
        color:var(--text);
        font-size:14.5px;
        font-family:inherit;
        outline:none;
        transition:background .18s, border-color .18s, box-shadow .18s;
    }
    .search input::placeholder{ color:#5c6779; }
    .search input:focus{
        background:rgba(255,255,255,.075);
        border-color:rgba(124,92,255,.65);
        box-shadow:0 0 0 4px rgba(124,92,255,.16), 0 10px 34px -12px rgba(124,92,255,.85);
    }

    .search-icon{
        position:absolute; left:14px; top:50%; transform:translateY(-50%);
        width:18px; height:18px; color:#5c6779; pointer-events:none;
    }

    .clear{
        position:absolute; right:10px; top:50%; transform:translateY(-50%);
        width:26px; height:26px; border-radius:8px;
        display:none; place-items:center;
        background:rgba(255,255,255,.07);
        border:none; color:var(--muted);
        font-size:15px; line-height:1; cursor:pointer;
        transition:.15s;
    }
    .clear:hover{ background:rgba(255,255,255,.14); color:var(--text); }
    .clear.show{ display:grid; }

    /* ---------- suggestions ---------- */
    .suggest{
        position:absolute; top:calc(100% + 8px); left:0; right:0;
        padding:6px;
        max-height:364px; overflow:auto;
        background:rgba(13,17,26,.97);
        backdrop-filter:blur(22px);
        -webkit-backdrop-filter:blur(22px);
        border:1px solid rgba(255,255,255,.11);
        border-radius:16px;
        box-shadow:0 26px 64px -14px rgba(0,0,0,.9);
        display:none;
        z-index:60;
    }
    .suggest.show{ display:block; animation:pop .14s ease; }
    @keyframes pop{ from{ opacity:0; transform:translateY(-6px) scale(.99); } to{ opacity:1; transform:none; } }

    .sug{
        display:flex; align-items:center; gap:10px;
        padding:8px 10px; border-radius:10px; cursor:pointer;
        transition:background .12s;
    }
    .sug:hover,
    .sug.active{ background:linear-gradient(90deg, rgba(124,92,255,.26), rgba(34,211,238,.09)); }

    .sug .num{
        font:600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color:#b39cff; background:rgba(124,92,255,.16);
        border-radius:6px; padding:4px 6px; min-width:30px; text-align:center;
        flex:0 0 auto;
    }
    .sug .name{
        flex:1; font-size:13.5px;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .sug .tag{
        flex:0 0 auto;
        font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
        color:var(--muted); border:1px solid var(--stroke);
        padding:3px 7px; border-radius:99px;
    }
    .sug-empty{ padding:16px; text-align:center; font-size:13px; color:var(--muted); }

    /* ---------- tools ---------- */
    .tools{ display:flex; gap:8px; flex:0 0 auto; }
    .tool{
        padding:8px 14px; border-radius:10px;
        background:rgba(255,255,255,.05);
        border:1px solid var(--stroke);
        color:var(--muted); font-size:12px; font-weight:600; letter-spacing:.03em;
        font-family:inherit; cursor:pointer; transition:.16s;
    }
    .tool:hover{ color:var(--text); background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.2); }
    .tool:active{ transform:translateY(1px); }

    /* ---------- layout ---------- */
    .layout{
        flex:1; min-height:0;
        display:flex;
        justify-content:center;
        padding:14px;
        position:relative;
        z-index:1;
        overflow:hidden;
    }

    .panel{
        width:100%;
        max-width:1180px;
        min-height:0;
        background:rgba(255,255,255,.028);
        border:1px solid var(--stroke);
        border-radius:var(--radius);
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
        overflow:hidden;
        display:flex;
        flex-direction:column;
    }

    .tree-panel{
        flex:1;
        min-height:0;
        overflow:auto;
        padding:10px;
    }

    /* ---------- tree ---------- */
    .tree{ display:flex; flex-direction:column; gap:1px; }

    .row{
        display:flex; align-items:center; gap:9px;
        width:100%; padding:9px 10px;
        border-radius:11px;
        background:transparent; border:none;
        color:var(--text); font-family:inherit; font-size:13.5px;
        text-align:left; cursor:pointer;
        transition:background .13s, color .13s;
    }
    .row:hover{ background:rgba(255,255,255,.055); }

    .head{ font-weight:650; letter-spacing:.02em; }
    .head .label{ flex:1; }

    .chev{
        width:14px; height:14px; flex:0 0 auto;
        color:var(--muted);
        transition:transform .2s ease, color .2s ease;
    }
    .node.open > .head .chev{ transform:rotate(90deg); color:var(--accent2); }

    .count{
        font:600 10.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color:var(--muted); background:rgba(255,255,255,.05);
        padding:4px 8px; border-radius:99px;
        flex:0 0 auto;
    }
    .node.open > .head .count{ background:rgba(124,92,255,.18); color:#b39cff; }

    .children{
        display:none;
        margin-left:15px;
        padding-left:10px;
        border-left:1px solid rgba(255,255,255,.07);
    }
    .node.open > .children{ display:block; animation:slide .18s ease; }
    @keyframes slide{ from{ opacity:0; transform:translateY(-5px); } to{ opacity:1; transform:none; } }

    .node.archive > .head .label{
        font-weight:600; color:var(--muted);
        font-size:12px; letter-spacing:.09em; text-transform:uppercase;
    }

    .item .num{
        font:600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color:#616f86; min-width:20px; flex:0 0 auto;
        transition:color .13s;
    }
    .item:hover .num{ color:var(--accent2); }

    .item .nm{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .hidden{ display:none !important; }

    mark{
        background:rgba(34,211,238,.22);
        color:#a5f3fc;
        border-radius:3px;
        padding:0 1px;
    }

    @keyframes flash{
        0%{ background:rgba(124,92,255,.5); box-shadow:inset 0 0 0 1px rgba(124,92,255,.75); }
        100%{ background:transparent; box-shadow:inset 0 0 0 1px transparent; }
    }
    .item.flash{ animation:flash 1.4s ease; }

    /* ---------- loading / error ---------- */
    .loading{ padding:34px 16px; text-align:center; font-size:13px; color:var(--muted); }

    .load-error{
        margin:18px; padding:18px 20px;
        border:1px solid rgba(255,120,120,.35);
        background:rgba(255,80,80,.07);
        border-radius:14px; font-size:13px; line-height:1.65; color:#f3c9c9;
    }
    .load-error strong{ display:block; color:#ffd7d7; font-size:14px; margin-bottom:8px; }
    .load-error code{
        display:inline-block; padding:1px 6px; border-radius:6px;
        background:rgba(255,255,255,.08); color:#e8ecf5;
        font:600 12px/1.7 ui-monospace, Menlo, monospace;
    }
    .load-error p{ margin:10px 0 0; color:#cfd7e6; }

    /* ---------- toast ---------- */
    .toast{
        position:fixed; left:50%; bottom:26px;
        transform:translate(-50%, 16px);
        padding:9px 18px; border-radius:99px;
        background:rgba(20,26,40,.96);
        border:1px solid rgba(124,92,255,.45);
        color:#dfe6f5; font-size:12.5px;
        opacity:0; pointer-events:none;
        transition:opacity .22s, transform .22s;
        backdrop-filter:blur(12px);
        z-index:200;
    }
    .toast.show{ opacity:1; transform:translate(-50%, 0); }

    /* ---------- responsive ---------- */
    @media (max-width: 780px){
        body{ height:auto; overflow:auto; }
        .layout{ overflow:visible; }
        .panel{ max-height:78vh; }
        .topbar{ flex-wrap:wrap; gap:10px; }
        .search{ order:3; flex-basis:100%; max-width:none; }
        .brand p{ display:none; }
    }
</style>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <div class="logo">M</div>
        <div>
            <h1>Mnemonics</h1>
            <p>People · 2019-03.30 · 1440hr</p>
        </div>
    </div>

    <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.2-3.2"></path>
        </svg>
        <input id="q" type="text" autocomplete="off" spellcheck="false"
               placeholder="Loading entries…   (press / to focus)">
        <button class="clear" id="clearBtn" type="button" aria-label="Clear">✕</button>
        <div class="suggest" id="suggest"></div>
    </div>

    <div class="tools">
        <button class="tool" id="expandAll" type="button">Expand</button>
        <button class="tool" id="collapseAll" type="button">Collapse</button>
    </div>
</header>

<main class="layout">
    <section class="panel">
        <div class="tree-panel">
            <div class="tree" id="tree"></div>
        </div>
    </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
    'use strict';

    /* =========================================================
       CONFIG
       ========================================================= */
    const DATA_URL = './data/mnemonics_table.txt';

    /* =========================================================
       HELPERS
       ========================================================= */
    const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // Defensive: strip any extension that might still sneak in.
    const stripExt = s => s.replace(/\.(jpe?g|png|gif|bmp|webp)$/i, '');

    const CHEV_SVG = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
                   + 'stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
                   + '<polyline points="9 18 15 12 9 6"></polyline></svg>';

    const treeEl   = document.getElementById('tree');
    const input    = document.getElementById('q');
    const suggestEl= document.getElementById('suggest');
    const clearBtn = document.getElementById('clearBtn');
    const toastEl  = document.getElementById('toast');

    const allItems = [];
    const groups   = [];
    const expanded = new Set();
    let uidCounter = 0;

    /* =========================================================
       DATA  —  parse the plain-text table
       ---------------------------------------------------------
       Returns: [ { label, items: [...], archive: [...] }, ... ]
       Throws with a line number on malformed input.
       ========================================================= */
    function parseTable(text) {
        text = text.replace(/^\uFEFF/, '');          // strip BOM

        const out = [];
        const byLabel = new Map();
        let target = null;

        text.split(/\r?\n/).forEach(function (rawLine, i) {
            const line = rawLine.trim();
            if (!line) return;

            if (line.startsWith('##')) {
                let head = line.slice(2).trim();
                let isArchive = false;

                const m = head.match(/^(.*?)\s*\|\s*archive\s*$/i);
                if (m) { head = m[1].trim(); isArchive = true; }

                if (!head) {
                    throw new Error('Line ' + (i + 1) + ': empty group label');
                }

                let g = byLabel.get(head);
                if (!g) {
                    g = { label: head, items: [], archive: [] };
                    byLabel.set(head, g);
                    out.push(g);
                }
                target = isArchive ? g.archive : g.items;
                return;
            }

            if (line.startsWith('#')) return;        // comment

            if (!target) {
                throw new Error('Line ' + (i + 1) + ': entry before any group header (## …)');
            }
            target.push(line);
        });

        return out;
    }

    async function loadTable() {
        const res = await fetch(DATA_URL, { cache: 'no-cache' });
        if (!res.ok) {
            throw new Error(res.status + ' ' + res.statusText + ' — ' + DATA_URL);
        }
        return parseTable(await res.text());
    }

    /* =========================================================
       TREE BUILDER
       ========================================================= */
    function parseEntry(entry) {
        const m = entry.match(/^(\d+)\.\s*([\s\S]*)$/);
        return m ? { num: m[1], name: m[2] } : { num: '', name: entry };
    }

    function buildNode(label, entries, isArchive) {
        const node = {
            uid: 'n' + (uidCounter++),
            label: label,
            isArchive: !!isArchive,
            items: [],
            subNodes: [],
            open: false
        };

        const el = document.createElement('div');
        el.className = 'node' + (isArchive ? ' archive' : '');

        const head = document.createElement('button');
        head.type = 'button';
        head.className = 'row head';
        head.innerHTML = CHEV_SVG
            + '<span class="label">' + esc(label) + '</span>'
            + '<span class="count">' + entries.length + '</span>';

        const children = document.createElement('div');
        children.className = 'children';

        el.appendChild(head);
        el.appendChild(children);

        node.el = el;
        node.childrenEl = children;
        head.addEventListener('click', () => setOpen(node, !node.open));

        entries.forEach(raw => {
            const parsed = parseEntry(raw);
            const base = stripExt(parsed.name);

            const itemEl = document.createElement('div');
            itemEl.className = 'row item';
            itemEl.innerHTML =
                '<span class="num">' + esc(parsed.num) + '</span>' +
                '<span class="nm">' + esc(base) + '</span>';

            const item = {
                el: itemEl,
                num: parsed.num,
                base: base,
                text: (parsed.num + '. ' + base).toLowerCase(),
                chain: [node]
            };

            itemEl.addEventListener('click', () => copyItem(item));

            node.items.push(item);
            allItems.push(item);
            children.appendChild(itemEl);
        });

        return node;
    }

    function buildTree(data) {
        data.forEach(function (row) {
            const group = buildNode(row.label, row.items, false);

            if (row.archive.length) {
                const arch = buildNode('archive', row.archive, true);
                arch.items.forEach(function (it) { it.chain = [group, arch]; });
                group.childrenEl.appendChild(arch.el);
                group.subNodes.push(arch);
            }

            groups.push(group);
            treeEl.appendChild(group.el);
        });
    }

    /* =========================================================
       OPEN / CLOSE
       ========================================================= */
    function setOpen(node, open, record) {
        if (record === undefined) record = true;
        node.open = open;
        node.el.classList.toggle('open', open);
        if (record) {
            if (open) expanded.add(node.uid);
            else expanded.delete(node.uid);
        }
    }

    function walk(node, fn) {
        fn(node);
        node.subNodes.forEach(function (n) { walk(n, fn); });
    }

    /* =========================================================
       FILTERING THE TREE
       ========================================================= */
    function filterTree(value) {
        const q = value.trim().toLowerCase();

        if (!q) {
            groups.forEach(resetNode);
            return;
        }

        groups.forEach(function (g) { filterNode(g, q); });
    }

    function filterNode(node, q) {
        let any = false;

        node.items.forEach(function (it) {
            const match = it.text.indexOf(q) !== -1;
            it.el.classList.toggle('hidden', !match);
            if (match) {
                any = true;
                paintHighlight(it, q);
            } else {
                it.el.querySelector('.nm').textContent = it.base;
            }
        });

        node.subNodes.forEach(function (sub) {
            const subAny = filterNode(sub, q);
            sub.el.classList.toggle('hidden', !subAny);
            if (subAny) any = true;
        });

        node.el.classList.toggle('hidden', !any);
        setOpen(node, any, false);
        return any;
    }

    function resetNode(node) {
        node.items.forEach(function (it) {
            it.el.classList.remove('hidden');
            it.el.querySelector('.nm').textContent = it.base;
        });
        node.subNodes.forEach(function (sub) {
            sub.el.classList.remove('hidden');
            resetNode(sub);
        });
        node.el.classList.remove('hidden');
        setOpen(node, expanded.has(node.uid), false);
    }

    function paintHighlight(item, q) {
        const nm = item.el.querySelector('.nm');
        const lower = item.base.toLowerCase();
        let out = '', i = 0, idx;

        while ((idx = lower.indexOf(q, i)) !== -1) {
            out += esc(item.base.slice(i, idx));
            out += '<mark>' + esc(item.base.slice(idx, idx + q.length)) + '</mark>';
            i = idx + q.length;
        }
        out += esc(item.base.slice(i));
        nm.innerHTML = out;
    }

    /* =========================================================
       AUTOCOMPLETE
       ========================================================= */
    let sugItems = [];
    let activeIdx = -1;

    function renderSuggest(value) {
        const q = value.trim().toLowerCase();

        if (!q) {
            hideSuggest();
            return;
        }

        const scored = [];

        for (let i = 0; i < allItems.length; i++) {
            const it = allItems[i];
            const idx = it.text.indexOf(q);
            if (idx === -1) continue;

            let score = idx;
            const b = it.base.toLowerCase();

            if (b.startsWith(q)) score -= 2000;
            else if (b.indexOf(' ' + q) !== -1) score -= 1000;
            if (it.num && it.num === q) score -= 3000;

            scored.push({ it: it, score: score });
        }

        scored.sort(function (a, b) {
            return a.score - b.score || a.it.base.localeCompare(b.it.base);
        });

        sugItems = scored.slice(0, 12).map(function (s) { return s.it; });
        activeIdx = sugItems.length ? 0 : -1;

        if (!sugItems.length) {
            suggestEl.innerHTML = '<div class="sug-empty">No matches for “' + esc(value.trim()) + '”</div>';
        } else {
            suggestEl.innerHTML = sugItems.map(function (it, i) {
                const g = it.chain[0].label;
                const tag = it.chain.length > 1 ? g + ' · arc' : g;
                return '<div class="sug" data-i="' + i + '">'
                     +   '<span class="num">' + (it.num || '—') + '</span>'
                     +   '<span class="name">' + esc(it.base) + '</span>'
                     +   '<span class="tag">' + tag + '</span>'
                     + '</div>';
            }).join('');
        }

        suggestEl.classList.add('show');
        paintActive();
    }

    function paintActive() {
        const rows = suggestEl.querySelectorAll('.sug');
        for (let i = 0; i < rows.length; i++) {
            rows[i].classList.toggle('active', i === activeIdx);
        }
        const active = suggestEl.querySelector('.sug.active');
        if (active) active.scrollIntoView({ block: 'nearest' });
    }

    function hideSuggest() {
        suggestEl.classList.remove('show');
        sugItems = [];
        activeIdx = -1;
    }

    /* =========================================================
       NAVIGATE TO AN ITEM
       ========================================================= */
    function goTo(item) {
        input.value = '';
        clearBtn.classList.remove('show');
        hideSuggest();

        groups.forEach(resetNode);

        item.chain.forEach(function (n) {
            setOpen(n, true);
            n.el.classList.remove('hidden');
        });
        item.el.classList.remove('hidden');

        item.el.scrollIntoView({ block: 'center', behavior: 'smooth' });

        item.el.classList.remove('flash');
        void item.el.offsetWidth;
        item.el.classList.add('flash');

        input.blur();
    }

    /* =========================================================
       COPY TO CLIPBOARD
       ========================================================= */
    let toastTimer = null;

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
    }

    function copyItem(item) {
        const text = item.num ? item.num + '. ' + item.base : item.base;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
                showToast('Copied  ·  ' + text);
            }).catch(function () {
                showToast(text);
            });
        } else {
            showToast(text);
        }
    }

    /* =========================================================
       EVENTS
       ========================================================= */
    input.addEventListener('input', function () {
        const v = input.value;
        clearBtn.classList.toggle('show', v.length > 0);
        filterTree(v);
        renderSuggest(v);
    });

    input.addEventListener('focus', function () {
        if (input.value.trim() && sugItems.length) suggestEl.classList.add('show');
    });

    input.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            if (!sugItems.length) return;
            e.preventDefault();
            const dir = e.key === 'ArrowDown' ? 1 : -1;
            activeIdx = (activeIdx + dir + sugItems.length) % sugItems.length;
            paintActive();
        } else if (e.key === 'Enter') {
            if (activeIdx >= 0 && sugItems[activeIdx]) {
                e.preventDefault();
                goTo(sugItems[activeIdx]);
            }
        } else if (e.key === 'Escape') {
            input.value = '';
            clearBtn.classList.remove('show');
            hideSuggest();
            filterTree('');
            input.blur();
        }
    });

    clearBtn.addEventListener('click', function () {
        input.value = '';
        clearBtn.classList.remove('show');
        hideSuggest();
        filterTree('');
        input.focus();
    });

    suggestEl.addEventListener('mousedown', function (e) {
        const row = e.target.closest('.sug');
        if (!row) return;
        e.preventDefault();
        const i = parseInt(row.dataset.i, 10);
        if (sugItems[i]) goTo(sugItems[i]);
    });

    document.addEventListener('click', function (e) {
        if (!e.target.closest('.search')) hideSuggest();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === '/' && document.activeElement !== input) {
            e.preventDefault();
            input.focus();
            input.select();
        }
    });

    document.getElementById('expandAll').addEventListener('click', function () {
        groups.forEach(function (g) { walk(g, function (n) { setOpen(n, true); }); });
    });

    document.getElementById('collapseAll').addEventListener('click', function () {
        groups.forEach(function (g) { walk(g, function (n) { setOpen(n, false); }); });
    });

    /* =========================================================
       STARTUP
       ========================================================= */
    treeEl.innerHTML = '<div class="loading">Loading data…</div>';

    loadTable().then(function (data) {
        treeEl.innerHTML = '';
        buildTree(data);

        input.placeholder = 'Search ' + allItems.length + ' entries…   (press / to focus)';

        // If the user typed while the data was still in flight, re-apply the query.
        if (input.value) {
            filterTree(input.value);
            renderSuggest(input.value);
        }
    }).catch(function (err) {
        console.error(err);
        treeEl.innerHTML =
            '<div class="load-error">' +
              '<strong>Could not load the data file</strong>' +
              '<code>' + esc(DATA_URL) + '</code>' +
              '<p>' + esc(err.message) + '</p>' +
              '<p>Opened straight from disk (<code>file://</code>)? Browsers block ' +
                 '<code>fetch</code> there. Serve the folder over HTTP — ' +
                 'e.g. <code>python3 -m http.server</code> — then visit ' +
                 '<code>http://localhost:8000/</code>.</p>' +
            '</div>';
        input.placeholder = 'Data unavailable   (press / to focus)';
    });

})();
</script>
</body>
</html>
